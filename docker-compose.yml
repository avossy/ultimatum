services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: service_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: avossy
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sql/seed-data.sql:/docker-entrypoint-initdb.d/2-seed-data.sql
    ports:
      - "5432:5432"

  server:
    build: ./server
    container_name: ultimatum_server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:avossy@db:5432/service_center
      JWT_SECRET: ${JWT_SECRET:-change_me}
    depends_on:
      - db

volumes:
  pgdata:
